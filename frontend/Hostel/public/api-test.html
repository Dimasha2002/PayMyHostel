<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 10px; padding: 10px; }
        #results { background: #f5f5f5; padding: 10px; margin: 20px 0; max-height: 400px; overflow-y: auto; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>API Test Page</h1>
    <button id="loginBtn">Admin Login</button>
    <button id="getStudentsBtn">Get Students</button>
    <button id="updateStudentBtn">Update First Student</button>
    <div id="results"></div>

    <script>
        let authToken = '';
        let students = [];
        
        const resultsDiv = document.getElementById('results');
        
        function log(message) {
            console.log(message);
            const pre = document.createElement('pre');
            pre.textContent = typeof message === 'object' ? JSON.stringify(message, null, 2) : message;
            resultsDiv.appendChild(pre);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        // Admin login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            try {
                log('Attempting admin login...');
                const response = await fetch('http://localhost:5000/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'Hostel',
                        password: 'H123'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log('Login response:');
                log(data);
                
                if (data.success) {
                    authToken = data.token;
                    log('Token saved successfully');
                    localStorage.setItem('token', authToken);
                }
            } catch (error) {
                log('Login error: ' + error.message);
            }
        });
        
        // Get students
        document.getElementById('getStudentsBtn').addEventListener('click', async () => {
            if (!authToken) {
                log('Please login first');
                return;
            }
            
            try {
                log('Fetching students...');
                const response = await fetch('http://localhost:5000/api/users/students', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log('Students response:');
                log(data);
                
                if (data.success) {
                    students = data.students;
                    log(`Found ${students.length} students`);
                    log('First student:');
                    log(students[0]);
                }
            } catch (error) {
                log('Get students error: ' + error.message);
            }
        });
        
        // Update student
        document.getElementById('updateStudentBtn').addEventListener('click', async () => {
            if (!authToken || students.length === 0) {
                log('Please login and get students first');
                return;
            }
            
            const firstStudent = students[0];
            log('Updating student:');
            log(firstStudent);
            
            try {
                const updateData = {
                    fullName: firstStudent.fullName + ' (Test Update)',
                    email: firstStudent.email,
                    phone: firstStudent.phone,
                    hostelBlock: firstStudent.hostelBlock,
                    roomNumber: firstStudent.roomNumber
                };
                
                log('Update data:');
                log(updateData);
                
                const response = await fetch('http://localhost:5000/api/users/' + firstStudent._id, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log('Update response:');
                log(data);
            } catch (error) {
                log('Update error: ' + error.message);
            }
        });
    </script>
</body>
</html>
