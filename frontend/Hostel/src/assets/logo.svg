<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular background -->
  <circle cx="100" cy="100" r="95" fill="#e8f2ff" stroke="#0437F2" stroke-width="3"/>
  
  <!-- Outer house shape -->
  <g id="house">
    <!-- Roof -->
    <path d="M 50 120 L 100 50 L 150 120 Z" fill="#0437F2" stroke="#003d7a" stroke-width="2"/>
    <!-- Roof top accent -->
    <path d="M 55 115 L 100 60 L 145 115 Z" fill="#007FFF" stroke="#0437F2" stroke-width="1.5"/>
    
    <!-- House body -->
    <rect x="60" y="120" width="80" height="70" rx="6" fill="#ffffff" stroke="#0437F2" stroke-width="2"/>
    
    <!-- Door frame -->
    <rect x="85" y="140" width="30" height="50" rx="3" fill="#f0f0f0" stroke="#0437F2" stroke-width="1.5"/>
    
    <!-- Door handle -->
    <circle cx="112" cy="165" r="1.5" fill="#0437F2"/>
  </g>
  
  <!-- Dollar sign inside -->
  <g id="dollar-sign">
    <text x="100" y="110" font-size="45" font-weight="bold" fill="#FFA500" text-anchor="middle" font-family="Arial, sans-serif">$</text>
  </g>
</svg>

